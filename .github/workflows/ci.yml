name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Check formatting
        run: npx prettier nodes credentials --check

      - run: npm run lint

      - name: n8n node lint
        run: npx @n8n/node-cli@latest lint

      - run: npm run build
